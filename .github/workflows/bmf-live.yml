name: BMF live verification

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bmf-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Compare tax calculations with BMF (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:bmf
